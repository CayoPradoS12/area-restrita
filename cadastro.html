<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro – Sistema Acadêmico</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="card">
    <h1>Criar conta</h1>
    <form id="formCadastro">
      <label for="nome">Nome</label>
      <input type="text" id="nome" required>
      <label for="email">E-mail</label>
      <input type="email" id="email" required>
      <label for="senha">Senha (mín. 6 caracteres)</label>
      <input type="password" id="senha" minlength="6" required>
      <button type="submit">Cadastrar</button>
    </form>
    <p class="link">Já tem conta? <a href="index.html">Voltar ao login</a></p>
  </main>
  <script type="module" src="js/cadastro.js"></script>
</body>
</html>
